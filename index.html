<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE4" />
    <title>GamesCabinet</title>
    <script>
      (() => {
        try {
          const t = localStorage.getItem('gamescabinet.theme');
          if (t === 'white' || t === 'light' || t === 'dark' || t === 'black') {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        try {
          const m = localStorage.getItem('gamescabinet.motion');
          const preferred =
            m === 'reduced' || m === 'normal' || m === 'playful' ? m : 'normal';
          const reduced =
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.setAttribute('data-motion', reduced ? 'reduced' : preferred);
        } catch {
          document.documentElement.setAttribute('data-motion', 'normal');
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
